<style>
/* ============ TEMA WARNA (ubah di sini) ============ */
:root{
  --biru:#1E3A8A; --biru-muda:#3B82F6; --hijau:#10B981; --hijau-tua:#047857;
  --merah:#DC2626; --kuning:#F59E0B; --abu:#64748B; --bg:#F1F5F9; --kartu:#FFFFFF;
  --teks:#0F172A; --garis:#E2E8F0; --radius:12px;
  --shadow:0 4px 14px rgba(15,23,42,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Poppins','Inter',system-ui,sans-serif;background:var(--bg);color:var(--teks);font-size:14px;display:flex;flex-direction:column;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:inherit}
a{color:var(--biru-muda)}

/* ---------- Header ---------- */
.header{background:linear-gradient(120deg,var(--biru) 0%,#2563EB 55%,var(--hijau) 130%);color:#fff;box-shadow:var(--shadow)}
.header-top{display:flex;align-items:center;gap:14px;padding:12px 20px;max-width:1280px;margin:0 auto;flex-wrap:wrap}
.logo{width:56px;height:56px;border-radius:50%;background:#fff;padding:4px;object-fit:contain;flex-shrink:0}
.brand h1{font-size:19px;font-weight:700;letter-spacing:.5px;line-height:1.2}
.brand p{font-size:12px;opacity:.9}
.spacer{flex:1}
.userchip{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.15);padding:6px 8px 6px 14px;border-radius:30px;font-size:13px}
.userchip small{display:block;opacity:.85;font-size:11px}
.nav{background:rgba(0,0,0,.18)}
.nav-in{max-width:1280px;margin:0 auto;display:flex;gap:4px;padding:0 14px;overflow-x:auto}
.nav button{background:none;border:0;color:#fff;padding:11px 14px;cursor:pointer;opacity:.82;font-weight:500;white-space:nowrap;border-bottom:3px solid transparent}
.nav button:hover{opacity:1}
.nav button.on{opacity:1;border-bottom-color:var(--hijau);background:rgba(255,255,255,.08)}

/* ---------- Layout ---------- */
main{flex:1;max-width:1280px;width:100%;margin:0 auto;padding:20px 16px 30px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--kartu);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h2{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--biru)}
.card h2 i{color:var(--hijau)}
.page-title{font-size:20px;font-weight:700;color:var(--biru);margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--abu);font-size:12.5px}

/* ---------- Form & tombol ---------- */
label{display:block;font-weight:500;font-size:12.5px;margin:10px 0 4px;color:#334155}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],input[type=month],select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--garis);border-radius:9px;background:#fff;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--biru-muda);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:9px;border:1.5px solid var(--garis);background:#fff;cursor:pointer;font-weight:500;transition:.15s;color:var(--teks)}
.btn:hover{background:#F8FAFC}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--biru);border-color:var(--biru);color:#fff}
.btn.primary:hover{background:#1e40af}
.btn.green{background:var(--hijau);border-color:var(--hijau);color:#fff}
.btn.green:hover{background:var(--hijau-tua)}
.btn.red{background:var(--merah);border-color:var(--merah);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.big{padding:16px 20px;font-size:16px;font-weight:600;border-radius:12px;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 14px}

/* ---------- Tabel ---------- */
.tw{overflow-x:auto;border-radius:10px;border:1px solid var(--garis)}
table{width:100%;border-collapse:collapse;min-width:640px;background:#fff}
th{background:#EFF6FF;color:var(--biru);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--garis);font-size:13px;vertical-align:middle}
tr:hover td{background:#FAFCFF}
td.c,th.c{text-align:center}
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--biru-muda);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0}
.who{display:flex;align-items:center;gap:10px}

/* ---------- Badge ---------- */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-Hadir{background:#D1FAE5;color:#065F46}.b-Terlambat{background:#FEF3C7;color:#92400E}
.b-Izin{background:#DBEAFE;color:#1E40AF}.b-Sakit{background:#FCE7F3;color:#9D174D}
.b-Cuti{background:#EDE9FE;color:#5B21B6}.b-Alpa{background:#FEE2E2;color:#991B1B}
.b-Belum{background:#F1F5F9;color:#475569}.b-out{background:#FEE2E2;color:#991B1B}.b-in{background:#D1FAE5;color:#065F46}

/* ---------- Statistik ---------- */
.stat{display:flex;align-items:center;gap:14px}
.stat .ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0}
.stat b{font-size:24px;display:block;line-height:1.1}
.stat span{font-size:12px;color:var(--abu)}

/* ---------- Absen ---------- */
.clock{text-align:center;padding:6px 0 14px}
.clock .t{font-size:42px;font-weight:700;color:var(--biru);letter-spacing:2px;line-height:1}
.clock .d{color:var(--abu);margin-top:6px}
#map,#setmap{height:300px;border-radius:10px;border:1px solid var(--garis);z-index:0}
.geo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.geo div{background:#F8FAFC;border-radius:8px;padding:8px 10px;font-size:12px}
.geo b{display:block;font-size:13px;word-break:break-all}
.alert{padding:10px 14px;border-radius:9px;font-size:13px;margin-top:10px;display:flex;gap:10px;align-items:flex-start}
.alert.ok{background:#D1FAE5;color:#065F46}.alert.warn{background:#FEF3C7;color:#92400E}.alert.bad{background:#FEE2E2;color:#991B1B}.alert.info{background:#DBEAFE;color:#1E40AF}

/* ---------- Login ---------- */
.login-wrap{max-width:420px;margin:30px auto}
.tabs{display:flex;background:#E2E8F0;border-radius:10px;padding:4px;margin-bottom:6px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--abu)}
.tabs button.on{background:#fff;color:var(--biru);box-shadow:0 1px 4px rgba(0,0,0,.1)}

/* ---------- Modal & toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000}
.modal{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto}
.modal h3{color:var(--biru);margin-bottom:6px}
.modal video{width:100%;border-radius:10px;background:#000;margin:10px 0;transform:scaleX(-1)}
#toasts{position:fixed;top:14px;right:14px;z-index:2000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 28px)}
.toast{background:#fff;border-left:5px solid var(--biru);padding:12px 16px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;gap:10px;align-items:flex-start;animation:in .25s ease;min-width:240px}
.toast.success{border-color:var(--hijau)}.toast.error{border-color:var(--merah)}.toast.warn{border-color:var(--kuning)}
.toast.success i{color:var(--hijau)}.toast.error i{color:var(--merah)}.toast.warn i{color:var(--kuning)}
@keyframes in{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

/* ---------- Footer ---------- */
footer{background:#0F172A;color:#CBD5E1;text-align:center;padding:16px;font-size:12.5px;line-height:1.7}
footer b{color:#fff}
.chartbox{position:relative;height:340px}
.thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:#EFF6FF;color:var(--biru);padding:4px 10px;border-radius:20px;font-size:12px;display:flex;align-items:center;gap:6px}
.chip button{border:0;background:none;cursor:pointer;color:var(--merah)}
@media(max-width:600px){
  .brand h1{font-size:15px}.logo{width:44px;height:44px}.clock .t{font-size:34px}
  .geo{grid-template-columns:1fr}.card{padding:14px}
}
</style>
</head>

<!-- ================= HEADER ================= -->
<header class="header">
  <div class="header-top">
    <img id="hLogo" class="logo" alt="Logo sekolah">
    <div class="brand">
      <h1 id="hName">SMPN 4 TINGGIMONCONG</h1>
      <p id="hSub">Aplikasi Absensi Kehadiran Guru</p>
    </div>
    <div class="spacer"></div>
    <div id="hUser"></div>
  </div>
  <nav class="nav" id="hNav" style="display:none"><div class="nav-in" id="hNavIn"></div></nav>
</header>

<main id="app"></main>

<!-- ================= FOOTER ================= -->
<footer>
  <div>Kepala Sekolah: <b id="fName">Syafruddin, S.Pd., M.Si.</b></div>
  <div>NIP. <b id="fNip">19690727 199503 1 003</b></div>
  <div id="fCopy"></div>
</footer>

<div id="toasts"></div>

<script>
/* =====================================================================
   APLIKASI ABSENSI GURU – SMPN 4 TINGGIMONCONG
   Semua data disimpan di localStorage browser (mode demo).
   Bagian "KONFIGURASI AWAL" di bawah dapat diubah langsung bila perlu,
   tetapi cara paling mudah adalah lewat menu Admin → Pengaturan.
   ===================================================================== */

/* ---------- KONFIGURASI AWAL (default) ---------- */
const DEFAULT_SETTINGS = {
  schoolName: 'SMPN 4 Tinggimoncong',
  instansi:   'Dinas Pendidikan Kabupaten Gowa',
  address:    'Kec. Tinggimoncong, Kabupaten Gowa, Sulawesi Selatan',
  logo:       '',                 // kosong = pakai logo bawaan; atau unggah di Pengaturan
  lat: -5.2667, lng: 119.8550,    // ⚠ GANTI dengan koordinat asli sekolah (Pengaturan → Lokasi)
  radius: 100,                    // radius maksimal (meter)
  lateTime: '07:15',              // lewat jam ini = Terlambat
  outTime:  '14:00',              // jam pulang standar
  workDays: [1,2,3,4,5],          // 0=Minggu ... 6=Sabtu
  holidays: [],                   // [{date:'2026-12-25', name:'Natal'}]
  headName: 'Syafruddin, S.Pd., M.Si.',
  headNip:  '19690727 199503 1 003',
  city: 'Tinggimoncong',
  reverseGeo: true,               // cari alamat otomatis (butuh internet)
  simulate: false,                // mode uji lokasi (tanpa GPS asli)
  adminUser: 'admin',
  adminPass: 'admin123'
};

/* ---------- LOGO BAWAAN (SVG) ---------- */
const DEFAULT_LOGO = 'data:image/svg+xml;utf8,' + encodeURIComponent(
 '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E3A8A"/><stop offset="1" stop-color="#10B981"/></linearGradient></defs>'+
 '<path d="M50 4 90 18v30c0 24-17 42-40 48C27 90 10 72 10 48V18z" fill="url(#g)" stroke="#fff" stroke-width="3"/>'+
 '<path d="M26 40c8-3 17-3 24 3 7-6 16-6 24-3v28c-8-3-17-3-24 3-7-6-16-6-24-3z" fill="#fff"/><path d="M50 43v28" stroke="#1E3A8A" stroke-width="3"/>'+
 '<text x="50" y="30" font-size="11" font-weight="700" text-anchor="middle" fill="#fff" font-family="Arial">SMPN 4</text></svg>');

const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI  = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const STATUS_LIST = ['Hadir','Terlambat','Izin','Sakit','Cuti'];

/* ---------- Utilitas ---------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const nowHMS = () => { const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const toSec = t => { const p=(t||'0:0:0').split(':').map(Number); return p[0]*3600+(p[1]||0)*60+(p[2]||0); };
const tglIndo = (d=new Date()) => `${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
const tglIndoStr = s => { const [y,m,d]=s.split('-').map(Number); return `${d} ${BULAN[m-1]} ${y}`; };
const fmtNip = n => { n=String(n||'').replace(/\D/g,''); return n.length===18 ? `${n.slice(0,8)} ${n.slice(8,14)} ${n.slice(14,15)} ${n.slice(15)}` : n; };
const initials = n => String(n||'?').replace(/[^A-Za-z\s]/g,'').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase() || '?';
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ toast('Penyimpanan browser penuh. Hapus foto/selfie lama.','error'); return false; } }
};

function haversine(lat1,lon1,lat2,lon2){
  const R=6371000, rad=x=>x*Math.PI/180;
  const a=Math.sin(rad(lat2-lat1)/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(rad(lon2-lon1)/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

/* ---------- Toast ---------- */
function toast(msg,type='info'){
  const ic={success:'fa-circle-check',error:'fa-circle-xmark',warn:'fa-triangle-exclamation',info:'fa-circle-info'}[type]||'fa-circle-info';
  const el=document.createElement('div'); el.className='toast '+type;
  el.innerHTML=`<i class="fa-solid ${ic}"></i><div>${esc(msg)}</div>`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.3s'; setTimeout(()=>el.remove(),300); }, 4200);
}

/* ---------- Modal ---------- */
function openModal(html){
  closeModal();
  const o=document.createElement('div'); o.className='overlay'; o.id='modalOv';
  o.innerHTML=`<div class="modal">${html}</div>`;
  o.addEventListener('mousedown',e=>{ if(e.target===o && !o.dataset.lock) closeModal(); });
  document.body.appendChild(o); return o;
}
function closeModal(){ const o=$('#modalOv'); if(o) o.remove(); }
function confirmBox(msg){ return window.confirm(msg); }

/* ---------- Data ---------- */
let settings = Object.assign({}, DEFAULT_SETTINGS, LS.get('tp_settings', {}));
let teachers = LS.get('tp_teachers', null);
let att      = LS.get('tp_att', null);
let logs     = LS.get('tp_logs', []);

const saveSettings = () => LS.set('tp_settings', settings);
const saveTeachers = () => LS.set('tp_teachers', teachers);
const saveAtt      = () => LS.set('tp_att', att);
function addLog(actor, action, detail=''){
  logs.unshift({t:new Date().toISOString(), actor, action, detail});
  if(logs.length>500) logs.length=500;
  LS.set('tp_logs', logs);
}

/* Data contoh: 10 guru (NIP fiktif) */
function seedTeachers(){
  return [
    ['198005122005011003','Andi Baharuddin, S.Pd.','Matematika'],
    ['198207202006042008','Hj. Nurhayati, S.Pd.','Bahasa Indonesia'],
    ['197911152005011005','Muh. Arsyad, S.Pd., M.Pd.','IPA'],
    ['198503302009022004','Sitti Rahmawati, S.Pd.','Bahasa Inggris'],
    ['198110102007011012','Syarifuddin, S.Pd., M.Si.','Informatika'],
    ['198812052011012006','Dewi Kartika, S.Pd.','IPS'],
    ['197709172003121004','Abd. Rahman, S.Ag.','Pendidikan Agama Islam'],
    ['199001252014022003','Nur Fadillah, S.Pd.','PJOK'],
    ['198604182010011011','Hasanuddin, S.Pd.','PPKn'],
    ['199205302019032007','Rina Marlina, S.Sn.','Seni Budaya']
  ].map(([nip,name,mapel])=>({id:uid(),nip,name,mapel,photo:'',password:'123456'}));
}

/* Data contoh absensi: hari kerja bulan berjalan sampai kemarin */
function seedAttendance(){
  const out=[], now=new Date(), y=now.getFullYear(), m=now.getMonth();
  for(let d=1; d<now.getDate(); d++){
    const dt=new Date(y,m,d), ds=ymd(dt);
    if(!isWorkday(ds)) continue;
    teachers.forEach(t=>{
      const r=Math.random();
      if(r>0.97) return; // alpa
      let status='Hadir'; if(r<0.10) status='Terlambat'; else if(r<0.14) status='Izin'; else if(r<0.18) status='Sakit'; else if(r<0.20) status='Cuti';
      const rec={id:uid(),nip:t.nip,date:ds,status,note:'(data contoh)',demo:true};
      if(status==='Hadir'||status==='Terlambat'){
        const mm = status==='Hadir' ? 25+Math.floor(Math.random()*45) : 76+Math.floor(Math.random()*40);
        const tm=`${pad(6+Math.floor(mm/60))}:${pad(mm%60)}:${pad(Math.floor(Math.random()*60))}`;
        rec.in={time:tm,lat:settings.lat+(Math.random()-.5)*0.0004,lng:settings.lng+(Math.random()-.5)*0.0004,dist:Math.round(Math.random()*60),inside:true,address:'',selfie:''};
        rec.out={time:`${pad(14+Math.floor(Math.random()*2))}:${pad(Math.floor(Math.random()*60))}:00`,lat:rec.in.lat,lng:rec.in.lng,dist:rec.in.dist,inside:true,address:'',selfie:''};
      }
      out.push(rec);
    });
  }
  return out;
}
if(!teachers){ teachers=seedTeachers(); saveTeachers(); }
if(!att){ att=seedAttendance(); saveAtt(); }

/* ---------- Kalender kerja ---------- */
function isWorkday(ds){
  const [y,m,d]=ds.split('-').map(Number); const dow=new Date(y,m-1,d).getDay();
  return settings.workDays.includes(dow) && !settings.holidays.some(h=>h.date===ds);
}
/* Hari kerja efektif = hari kerja pada bulan itu yang sudah lewat
   (hari ini dihitung setelah jam pulang). Dipakai untuk Alpa & persentase. */
function effectiveWorkdays(y,m){
  const now=new Date(), today=todayStr(), n=new Date(y,m+1,0).getDate(); let c=0;
  for(let d=1; d<=n; d++){
    const ds=`${y}-${pad(m+1)}-${pad(d)}`;
    if(ds>today) break;
    if(ds===today && toSec(nowHMS()) < toSec(settings.outTime)) break;
    if(isWorkday(ds)) c++;
  }
  return c;
}
const getRec = (nip,ds) => att.find(a=>a.nip===nip && a.date===ds);

function recapData(y,m){
  const days=effectiveWorkdays(y,m), pre=`${y}-${pad(m+1)}`;
  return {days, rows: teachers.map((t,i)=>{
    const rs=att.filter(a=>a.nip===t.nip && a.date.startsWith(pre));
    const c=s=>rs.filter(r=>r.status===s).length;
    const h=c('Hadir'), te=c('Terlambat'), iz=c('Izin'), sk=c('Sakit'), cu=c('Cuti');
    const alpa=Math.max(0, days-(h+te+iz+sk+cu));
    const pct= days ? Math.min(100,(h+te)/days*100) : 0;
    return {no:i+1,name:t.name,nip:t.nip,h,te,iz,sk,cu,alpa,pct};
  })};
}

const Guru={
  marker:null, circle:null,
  refreshToday(){
    const t=teachers.find(x=>x.nip===S.user.nip); const rec=getRec(t.nip,todayStr());
    let st='Belum absen';
    if(rec) st=rec.status+(rec.in&&!rec.in.inside?' (Di Luar Lokasi)':'');
    $('#fStat').value=st;
    const locked = rec && !rec.in;            // izin/sakit/cuti
    $('#btnIn').disabled  = !!rec;            // tidak bisa absen dua kali
    $('#btnOut').disabled = !(rec && rec.in && !rec.out);
    let info='';
    if(rec?.in) info+=`<div class="alert ok"><i class="fa-solid fa-circle-check"></i><div>Masuk pukul <b>${rec.in.time}</b> – <span class="badge b-${rec.status}">${rec.status}</span>${rec.in.inside?'':' <span class="badge b-out">Di Luar Lokasi</span>'}</div></div>`;
    if(rec?.out) info+=`<div class="alert ok"><i class="fa-solid fa-circle-check"></i><div>Pulang pukul <b>${rec.out.time}</b>${rec.out.inside?'':' <span class="badge b-out">Di Luar Lokasi</span>'}</div></div>`;
    if(locked) info+=`<div class="alert info"><i class="fa-solid fa-envelope"></i><div>Hari ini tercatat <b>${rec.status}</b>${rec.note?': '+esc(rec.note):''}</div></div>`;
    if(!isWorkday(todayStr())) info+=`<div class="alert warn"><i class="fa-solid fa-calendar-xmark"></i><div>Hari ini bukan hari kerja (libur / di luar jadwal).</div></div>`;
    $('#todayInfo').innerHTML=info;
  },
  history(){
    const pre=`${S.year}-${pad(S.month+1)}`; const nip=S.user.nip;
    const n=new Date(S.year,S.month+1,0).getDate(); let html='';
    for(let d=n; d>=1; d--){
      const ds=`${pre}-${pad(d)}`; if(ds>todayStr()) continue;
      const r=getRec(nip,ds); const dow=HARI[new Date(S.year,S.month,d).getDay()];
      if(!r && !isWorkday(ds)) continue;
      const stat=r?r.status:'Alpa';
      html+=`<tr><td>${tglIndoStr(ds)}</td><td>${dow}</td><td><span class="badge b-${stat}">${stat}</span></td>
        <td>${r?.in?.time||'-'}</td><td>${r?.out?.time||'-'}</td>
        <td>${r?.in?(r.in.inside?'<span class="badge b-in">Di Sekolah</span>':'<span class="badge b-out">Di Luar Lokasi</span>'):'-'}</td>
        <td>${esc(r?.note||'')}</td></tr>`;
    }
    $('#hist').innerHTML=html||'<tr><td colspan="7" class="muted" style="text-align:center;padding:20px">Belum ada data pada bulan ini.</td></tr>';
  },
  initMap(){
    mapObj=L.map('map').setView([settings.lat,settings.lng],17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(mapObj);
    L.circle([settings.lat,settings.lng],{radius:settings.radius,color:'#10B981',fillColor:'#10B981',fillOpacity:.15}).addTo(mapObj);
    L.marker([settings.lat,settings.lng],{title:'Sekolah'}).addTo(mapObj).bindPopup('<b>'+esc(settings.schoolName)+'</b><br>Titik lokasi sekolah');
    Guru.marker=null;
    if(settings.simulate){ Guru.sim(true); return; }
    if(!navigator.geolocation){ geo={ok:false,err:'Browser tidak mendukung GPS.'}; Guru.paint(); return; }
    $('#geoAlert').innerHTML='<div class="alert info"><i class="fa-solid fa-satellite-dish"></i><div>Meminta izin lokasi… Mohon pilih <b>Izinkan</b>.</div></div>';
    watchId=navigator.geolocation.watchPosition(p=>{
      Guru.setPos(p.coords.latitude,p.coords.longitude,p.coords.accuracy);
    },err=>{
      const m={1:'Izin lokasi ditolak. Aktifkan izin lokasi di pengaturan browser lalu muat ulang halaman.',2:'Posisi tidak tersedia. Pastikan GPS/Wi-Fi aktif.',3:'Waktu permintaan lokasi habis. Coba lagi.'}[err.code]||'Gagal membaca lokasi.';
      geo={ok:false,err:m}; Guru.paint();
    },{enableHighAccuracy:true,timeout:20000,maximumAge:5000});
  },
  sim(inside){
    const lat=inside?settings.lat+0.0002:settings.lat+0.0030, lng=inside?settings.lng+0.0002:settings.lng+0.0030;
    Guru.setPos(lat,lng,10);
  },
  _addrKey:'',
  setPos(lat,lng,acc){
    geo.ok=true; geo.lat=lat; geo.lng=lng; geo.acc=acc; geo.err='';
    geo.dist=haversine(lat,lng,settings.lat,settings.lng);
    Guru.paint();
    if(mapObj){
      if(!Guru.marker){ Guru.marker=L.circleMarker([lat,lng],{radius:9,color:'#fff',weight:3,fillColor:'#1E3A8A',fillOpacity:1}).addTo(mapObj).bindPopup('Posisi Anda'); mapObj.fitBounds(L.latLngBounds([[lat,lng],[settings.lat,settings.lng]]).pad(0.4),{maxZoom:18}); }
      else Guru.marker.setLatLng([lat,lng]);
    }
    const key=lat.toFixed(4)+','+lng.toFixed(4);
    if(settings.reverseGeo && key!==Guru._addrKey){ Guru._addrKey=key; geo.addr=''; Guru.reverse(lat,lng,key); }
  },
  async reverse(lat,lng,key){
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&accept-language=id`);
      const j=await r.json(); if(key===Guru._addrKey){ geo.addr=j.display_name||''; const el=$('#gAddr'); if(el) el.textContent=geo.addr?'📍 '+geo.addr:''; }
    }catch(e){ /* alamat opsional */ }
  },
  paint(){
    if(!$('#gLat')) return;
    if(!geo.ok){ $('#geoAlert').innerHTML=`<div class="alert bad"><i class="fa-solid fa-location-crosshairs"></i><div>${esc(geo.err||'Lokasi belum terdeteksi')}</div></div>`; return; }
    $('#gLat').textContent=geo.lat.toFixed(6); $('#gLng').textContent=geo.lng.toFixed(6);
    $('#gDist').textContent=Math.round(geo.dist)+' m (maks '+settings.radius+' m)'; $('#gAcc').textContent='± '+Math.round(geo.acc)+' m';
    const inside=geo.dist<=settings.radius;
    $('#geoAlert').innerHTML=inside
      ?'<div class="alert ok"><i class="fa-solid fa-circle-check"></i><div>Anda berada <b>di dalam area sekolah</b>.</div></div>'
      :'<div class="alert bad"><i class="fa-solid fa-triangle-exclamation"></i><div><b>Anda berada di luar area sekolah.</b> Absensi tetap bisa dicatat, tetapi ditandai “Di Luar Lokasi”.</div></div>';
  },

  async check(type){
    const t=teachers.find(x=>x.nip===S.user.nip), ds=todayStr(); let rec=getRec(t.nip,ds);
    if(!geo.ok) return toast('Lokasi belum terdeteksi. Izinkan akses lokasi terlebih dahulu.','error');
    if(type==='in' && rec) return toast('Anda sudah tercatat absen hari ini.','warn');
    if(type==='out'){
      if(!rec||!rec.in) return toast('Anda belum absen masuk hari ini.','warn');
      if(rec.out) return toast('Anda sudah absen pulang hari ini.','warn');
    }
    if(!isWorkday(ds) && !confirmBox('Hari ini bukan hari kerja. Tetap lanjutkan absensi?')) return;
    let selfie='';
    if($('#chkSelfie').checked) selfie=await takeSelfie();
    const time=nowHMS(), inside=geo.dist<=settings.radius;
    const pos={time,lat:+geo.lat.toFixed(6),lng:+geo.lng.toFixed(6),dist:Math.round(geo.dist),inside,address:geo.addr||'',selfie};
    if(type==='in'){
      const late=toSec(time)>toSec(settings.lateTime+':00');
      rec={id:uid(),nip:t.nip,date:ds,status:late?'Terlambat':'Hadir',note:'',in:pos};
      att.push(rec);
      if(!saveAtt()){ att.pop(); return; }
      addLog(t.nip,'Absen Masuk',`${time} • ${rec.status} • ${inside?'di sekolah':'DI LUAR LOKASI ('+pos.dist+' m)'}`);
      toast(`Absen masuk berhasil pukul ${time.slice(0,5)} – ${rec.status}`,late?'warn':'success');
    } else {
      rec.out=pos; saveAtt();
      addLog(t.nip,'Absen Pulang',`${time} • ${inside?'di sekolah':'DI LUAR LOKASI ('+pos.dist+' m)'}`);
      toast(`Absen pulang berhasil pukul ${time.slice(0,5)}`,'success');
    }
    if(!inside) toast('Anda berada di luar area sekolah – absensi ditandai “Di Luar Lokasi”.','warn');
    Guru.refreshToday(); Guru.history();
  },

  izin(){
    const t=teachers.find(x=>x.nip===S.user.nip); const ds=todayStr();
    if(getRec(t.nip,ds)) return toast('Anda sudah tercatat absen hari ini.','warn');
    openModal(`<h3>Ajukan Izin / Sakit / Cuti</h3><p class="muted">Untuk tanggal ${tglIndo()}</p>
      <label>Jenis</label><select id="iJenis"><option>Izin</option><option>Sakit</option><option>Cuti</option></select>
      <label>Keterangan</label><textarea id="iNote" rows="3" placeholder="Alasan singkat"></textarea>
      <div class="row end" style="margin-top:14px"><button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="Guru.saveIzin()">Simpan</button></div>`);
  },
  saveIzin(){
    const t=teachers.find(x=>x.nip===S.user.nip), ds=todayStr();
    if(getRec(t.nip,ds)) return toast('Sudah ada catatan hari ini.','warn');
    const st=$('#iJenis').value, note=$('#iNote').value.trim();
    if(!note) return toast('Keterangan wajib diisi.','error');
    att.push({id:uid(),nip:t.nip,date:ds,status:st,note}); saveAtt();
    addLog(t.nip,'Pengajuan '+st,note); closeModal(); toast(st+' berhasil dicatat.','success');
    Guru.refreshToday(); Guru.history();
  }
};

/* Selfie via kamera web (opsional) → dataURL JPEG kecil */
function takeSelfie(){
  return new Promise(res=>{
    const o=openModal(`<h3>Foto Selfie</h3><p class="muted">Posisikan wajah di depan kamera.</p><video id="cam" autoplay playsinline muted></video>
      <div class="row end"><button class="btn" id="camSkip">Lewati</button><button class="btn green" id="camSnap"><i class="fa-solid fa-camera"></i> Ambil Foto</button></div>`);
    o.dataset.lock='1'; let stream=null;
    const done=v=>{ if(stream) stream.getTracks().forEach(t=>t.stop()); closeModal(); res(v); };
    if(!navigator.mediaDevices?.getUserMedia){ toast('Kamera tidak tersedia, selfie dilewati.','warn'); return done(''); }
    navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}).then(s=>{ stream=s; $('#cam').srcObject=s; })
      .catch(()=>{ toast('Izin kamera ditolak, selfie dilewati.','warn'); done(''); });
    $('#camSkip').onclick=()=>done('');
    $('#camSnap').onclick=()=>{
      const v=$('#cam'); if(!v.videoWidth) return toast('Kamera belum siap.','warn');
      const c=document.createElement('canvas'), w=320, h=Math.round(v.videoHeight/v.videoWidth*w); c.width=w;c.height=h;
      c.getContext('2d').drawImage(v,0,0,w,h); done(c.toDataURL('image/jpeg',.6));
    };
  });
}

/* Perkecil gambar → dataURL (hemat localStorage). contain=true: kotak penuh tanpa terpotong */
function resizeImage(file,size,contain){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{
      const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d');
      if(contain){ const k=Math.min(size/img.width,size/img.height), w=img.width*k, h=img.height*k; x.drawImage(img,(size-w)/2,(size-h)/2,w,h); res(c.toDataURL('image/png')); }
      else { const k=Math.max(size/img.width,size/img.height), w=img.width*k, h=img.height*k; x.drawImage(img,(size-w)/2,(size-h)/2,w,h); res(c.toDataURL('image/jpeg',.8)); }
    }; img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

const Recap={

  /* ---- PDF: kop + logo + tabel + tanda tangan Kepala Sekolah ---- */
  async pdf(){

    doc.autoTable({startY:53,head:[Recap.head],body:Recap.body(),theme:'grid',styles:{fontSize:9,cellPadding:2},
      headStyles:{fillColor:[30,58,138],halign:'center'},columnStyles:{0:{halign:'center',cellWidth:10},3:{halign:'center'},4:{halign:'center'},5:{halign:'center'},6:{halign:'center'},7:{halign:'center'},8:{halign:'center'},9:{halign:'center',fontStyle:'bold'}},margin:{left:15,right:15}});
    let y=doc.lastAutoTable.finalY+10; if(y>H-52){ doc.addPage(); y=25; }
    const x=W-85; doc.setFontSize(10); doc.setFont('helvetica','normal');
    doc.text(`${settings.city}, ${tglIndo()}`,x,y); doc.text(`Kepala ${settings.schoolName}`,x,y+5);
    doc.setFont('helvetica','bold'); const ny=y+30; doc.text(settings.headName,x,ny);

  csv(){

      <p class="muted" style="margin-top:6px">Klik peta untuk memindahkan titik sekolah.</p>
      <div class="cols"><div><label>Latitude</label><input type="number" step="any" id="sLat" value="${s.lat}"></div><div><label>Longitude</label><input type="number" step="any" id="sLng" value="${s.lng}"></div></div>
      <div class="cols"><div><label>Radius maksimal (meter)</label><input type="number" id="sRad" value="${s.radius}" min="10"></div>
      <div style="align-self:end"><button class="btn" style="width:100%" onclick="Pref.useMyLoc()"><i class="fa-solid fa-crosshairs"></i> Pakai lokasi saya</button></div></div>
      <label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="sRev" ${s.reverseGeo?'checked':''} style="width:auto"> Cari alamat otomatis (reverse geocoding, butuh internet)</label>
      <label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="sSim" ${s.simulate?'checked':''} style="width:auto"> Mode simulasi lokasi (untuk uji coba tanpa GPS)</label>
    </div>
  </div>
  <div class="row end" style="margin-top:16px"><button class="btn primary big" style="max-width:260px" onclick="Pref.save()"><i class="fa-solid fa-floppy-disk"></i> Simpan Pengaturan</button></div>

  <div class="card" style="margin-top:16px"><h2><i class="fa-solid fa-database"></i> Data</h2>
    <div class="row">
      <button class="btn" onclick="Pref.backup()"><i class="fa-solid fa-download"></i> Cadangkan (JSON)</button>
      <label class="btn" style="margin:0"><i class="fa-solid fa-upload"></i> Pulihkan<input type="file" accept=".json" style="display:none" onchange="Pref.restore(this.files[0])"></label>
      <button class="btn" onclick="Pref.reseed()"><i class="fa-solid fa-wand-magic-sparkles"></i> Muat ulang data contoh</button>
      <button class="btn red" onclick="Pref.wipe()"><i class="fa-solid fa-trash"></i> Hapus semua absensi</button>
    </div></div>`;
  Pref.holidays=[...s.holidays]; Pref.drawHol();
  $('#sLogo').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; Pref.logo=await resizeImage(f,256,true); $('#sLogoPrev').src=Pref.logo; };
  Pref.logo=s.logo;
  mapObj=L.map('setmap').setView([s.lat,s.lng],16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(mapObj);
  Pref.mk=L.marker([s.lat,s.lng]).addTo(mapObj); Pref.ci=L.circle([s.lat,s.lng],{radius:s.radius,color:'#10B981',fillOpacity:.15}).addTo(mapObj);
  mapObj.on('click',e=>Pref.setLoc(e.latlng.lat,e.latlng.lng));
  ['sLat','sLng','sRad'].forEach(id=>$('#'+id).addEventListener('change',()=>Pref.fromInputs()));
}
const Pref={
  holidays:[],logo:'',mk:null,ci:null,
  setLoc(lat,lng){ $('#sLat').value=+lat.toFixed(6); $('#sLng').value=+lng.toFixed(6); Pref.fromInputs(); },
  fromInputs(){ const la=+$('#sLat').value, ln=+$('#sLng').value, r=+$('#sRad').value||100; if(isNaN(la)||isNaN(ln)) return;
    Pref.mk.setLatLng([la,ln]); Pref.ci.setLatLng([la,ln]); Pref.ci.setRadius(r); mapObj.setView([la,ln]); },
  useMyLoc(){
    if(!navigator.geolocation) return toast('Browser tidak mendukung GPS.','error');
    toast('Membaca lokasi Anda…','info');
    navigator.geolocation.getCurrentPosition(p=>{ Pref.setLoc(p.coords.latitude,p.coords.longitude); mapObj.setZoom(18); toast('Titik diambil dari lokasi Anda. Jangan lupa Simpan.','success'); },
      ()=>toast('Gagal mengambil lokasi. Periksa izin lokasi.','error'),{enableHighAccuracy:true,timeout:15000});
  },
  addHol(){ const d=$('#hDate').value, n=$('#hName').value.trim()||'Libur'; if(!d) return toast('Pilih tanggal libur.','error');
    if(Pref.holidays.some(h=>h.date===d)) return toast('Tanggal sudah ada.','warn'); Pref.holidays.push({date:d,name:n}); Pref.holidays.sort((a,b)=>a.date.localeCompare(b.date)); $('#hName').value=''; Pref.drawHol(); },
  delHol(d){ Pref.holidays=Pref.holidays.filter(h=>h.date!==d); Pref.drawHol(); },
  drawHol(){ $('#holList').innerHTML=Pref.holidays.map(h=>`<span class="chip">${tglIndoStr(h.date)} – ${esc(h.name)}<button onclick="Pref.delHol('${h.date}')"><i class="fa-solid fa-xmark"></i></button></span>`).join('')||'<span class="muted">Belum ada hari libur.</span>'; },
  resetLogo(){ Pref.logo=''; $('#sLogoPrev').src=DEFAULT_LOGO; },
  save(){
    const lat=+$('#sLat').value, lng=+$('#sLng').value, rad=+$('#sRad').value;
    if(isNaN(lat)||isNaN(lng)||lat<-90||lat>90||lng<-180||lng>180) return toast('Koordinat tidak valid.','error');
    if(!rad||rad<10) return toast('Radius minimal 10 meter.','error');
    const wd=$$('.wd').filter(c=>c.checked).map(c=>+c.value); if(!wd.length) return toast('Pilih minimal satu hari kerja.','error');
    if(!$('#sName').value.trim()||!$('#sHead').value.trim()) return toast('Nama sekolah dan kepala sekolah wajib diisi.','error');
    if(!$('#sAU').value.trim()||!$('#sAP').value.trim()) return toast('Akun admin tidak boleh kosong.','error');
    Object.assign(settings,{schoolName:$('#sName').value.trim(),instansi:$('#sInst').value.trim(),address:$('#sAddr').value.trim(),city:$('#sCity').value.trim(),logo:Pref.logo,
      headName:$('#sHead').value.trim(),headNip:$('#sHeadNip').value.trim(),adminUser:$('#sAU').value.trim(),adminPass:$('#sAP').value.trim(),
      lateTime:$('#sLate').value||'07:15',outTime:$('#sOut').value||'14:00',workDays:wd,holidays:Pref.holidays,lat,lng,radius:rad,
      reverseGeo:$('#sRev').checked,simulate:$('#sSim').checked});
    if(saveSettings()){ addLog('Admin','Ubah pengaturan',''); toast('Pengaturan disimpan.','success'); applyBranding(); }
  },
  backup(){
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify({settings,teachers,att,logs})],{type:'application/json'}));
    a.download=`cadangan_absensi_${todayStr()}.json`; a.click(); URL.revokeObjectURL(a.href);
  },
  restore(f){
    if(!f) return; const fr=new FileReader();
    fr.onload=()=>{ try{ const d=JSON.parse(fr.result); if(!d.teachers||!d.att) throw 0;
      settings=Object.assign({},DEFAULT_SETTINGS,d.settings||{}); teachers=d.teachers; att=d.att; logs=d.logs||[];
      saveSettings(); saveTeachers(); saveAtt(); LS.set('tp_logs',logs); toast('Data berhasil dipulihkan.','success'); render(); }catch(e){ toast('File cadangan tidak valid.','error'); } };
    fr.readAsText(f);
  },
  reseed(){ if(!confirmBox('Ganti SEMUA data guru & absensi dengan data contoh?')) return; teachers=seedTeachers(); att=seedAttendance(); saveTeachers(); saveAtt(); addLog('Admin','Muat data contoh',''); toast('Data contoh dimuat.','success'); },
  wipe(){ if(!confirmBox('Hapus SEMUA data absensi? Tindakan ini tidak dapat dibatalkan.')) return; att=[]; saveAtt(); addLog('Admin','Hapus semua absensi',''); toast('Seluruh data absensi dihapus.','success'); }
};
window.Pref=Pref;

/* ---------- Mulai ---------- */
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
render();
</script>
</body>
</html>
